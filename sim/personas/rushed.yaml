name: rushed
description: 'Rushed: answers several things at once and out of order, tries to end the call early once.'
rep_name: Haider Ali
today: '2026-09-21'
ground_truth: haider.json
ivr:
- say: Thank you for calling Meridian Dental Benefits provider services. For eligibility and benefits, say "benefits"
    or press one.
  expect_speech: benefit
